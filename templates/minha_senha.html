{% extends "base.html" %}
{% block titulo %}Alterar senha{% endblock %}
{% block conteudo %}
<div class="cartao">
  <h1>Alterar minha senha</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Senha atual<input name="atual" type="password" required></label>
    <label>Nova senha (mín. 8 caracteres)<input name="nova" type="password" minlength="8" required></label>
    <label>Confirmar nova senha<input name="nova2" type="password" minlength="8" required></label>
    <button class="btn primario">Salvar</button>
  </form>
</div>
{% endblock %}
