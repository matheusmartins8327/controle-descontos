{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="cartao">
  <img class="logo-entrada" src="{{ url_for('static', filename='img/logo-quinelato.png') }}" alt="Quinelato">
  <h1>Controle de Invoices</h1>
  <p class="sub">Importação · Descontos · Pagamentos</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>E-mail<input name="email" type="email" required autofocus></label>
    <label>Senha<input name="senha" type="password" required></label>
    <button class="btn primario">Entrar</button>
  </form>
</div>
{% endblock %}
